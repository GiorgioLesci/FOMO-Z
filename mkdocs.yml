site_name: FOMO-Z
repo_url: https://github.com/GiorgioLesci/FOMO-Z

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - API Reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          inventories: []
          paths: ["fomoz"]
